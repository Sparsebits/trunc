# Recipe: ci-restore in GitLab CI (or any CI with a POSIX shell, curl and tar).
#
# Copy flavors/ci-restore/ci-restore.sh into your repository (or fetch it from
# raw.githubusercontent.com once Sparsebits/trunc is public). While the trunc repository is
# private, set a masked CI/CD variable TRUNC_TOKEN to a GitHub token that can read it.
variables:
  TRUNC_VERSION: latest # or a tag such as v0.1.0

build:
  image: ubuntu:24.04
  cache:
    key:
      files: [Cargo.lock]
    paths: [cache.tar.zst] # one file: the runner's own unzip only restores that file
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates zstd
    # Restore: unpack the cache file into deps/, freeing it as it goes.
    - if [ -f cache.tar.zst ]; then sh ci/ci-restore.sh cache.tar.zst deps; fi
    # A big download, checked before extraction, freed while it unpacks.
    - sh ci/ci-restore.sh --sha256 "$MODEL_SHA256" "https://example.com/model-7b.tar.zst" models
  script:
    - ./build.sh
  after_script:
    # Save: pack deps/ into the cache file again (needs deps + archive, as any cache does).
    - test -f cache.tar.zst || tar --zstd -cf cache.tar.zst -C deps .
