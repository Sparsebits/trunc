# Recipe: a big actions/cache entry restored without doubling runner disk use.
#
# actions/cache extracts its own archive with tar while the download is still on disk, so a
# 4 GB cache that unpacks to 11 GB needs about 15 GB at its peak. Here the cached path is a
# single .tar.zst file instead: actions/cache restores that one file (up to 2 x 4 GB), and
# ci-restore unpacks it while freeing it (about 11 GB at the peak).
name: build
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: restore the cache file
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache.tar.zst
          key: deps-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: unpack it, freeing the archive as it goes
        if: steps.cache.outputs.cache-hit == 'true'
        uses: Sparsebits/trunc/flavors/ci-restore@main # pin to a commit SHA in real use
        with:
          archive: cache.tar.zst
          path: deps # must not already contain the cached files
          # token: ${{ secrets.TRUNC_READ_TOKEN }}  # while Sparsebits/trunc is private

      - name: build
        run: ./build.sh # fills deps/ on a cache miss

      # On a miss, pack the tree into one .tar.zst and save that file as the cache. Packing needs
      # the tree plus the archive, the same as actions/cache's own save; delete the tree first if
      # nothing after this step needs it.
      - name: pack the cache file
        if: steps.cache.outputs.cache-hit != 'true'
        run: tar --zstd -cf cache.tar.zst -C deps . # or: tar -I 'zstd -T0 -3' -cf ...
      - name: save the cache file
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache.tar.zst
          key: ${{ steps.cache.outputs.cache-primary-key }}
