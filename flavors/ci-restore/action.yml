name: ci-restore
description: Restore big CI caches and artifacts without doubling runner disk use (built on trunc).
author: Sparsebits
branding:
  icon: download
  color: green

inputs:
  archive:
    description: Archive to restore, a path or an http(s) URL (.tar.zst, .tar.gz, .tar.xz, .tar.bz2, ZIP, .trnc, ...).
    required: true
  path:
    description: Destination directory. Files that already exist there are not overwritten.
    required: false
    default: "."
  consume:
    description: Free the archive's space while extracting (the archive is gone afterwards). false is an ordinary extract.
    required: false
    default: "true"
  version:
    description: trunc release tag to install, e.g. v0.1.0.
    required: false
    default: latest
  verify-checksum:
    description: Check the downloaded trunc binary against the release's SHA256SUMS.
    required: false
    default: "true"
  token:
    description: Token for downloading trunc release assets through the GitHub API. Needed while Sparsebits/trunc is private (a token that can read it); public downloads need none.
    required: false
    default: ${{ github.token }}
  sha256:
    description: Expected SHA-256 of the archive, checked before anything is extracted.
    required: false
    default: ""
  args:
    description: Extra flags for `trunc x`, space-separated (e.g. --verify-media).
    required: false
    default: ""
  trunc-path:
    description: Use this trunc binary instead of installing a release (e.g. one built in the job).
    required: false
    default: ""
  repository:
    description: GitHub repository to install trunc from.
    required: false
    default: Sparsebits/trunc

outputs:
  bytes-written:
    description: Bytes of files written into the destination.
    value: ${{ steps.restore.outputs.bytes-written }}
  space-saved:
    description: Archive bytes freed during the restore (0 without consume).
    value: ${{ steps.restore.outputs.space-saved }}
  duration:
    description: Wall-clock seconds the extraction took.
    value: ${{ steps.restore.outputs.duration-seconds }}
  trunc-version:
    description: The `trunc --version` that ran.
    value: ${{ steps.restore.outputs.trunc-version }}
  trunc-path:
    description: Path of the trunc binary (also added to PATH for later steps).
    value: ${{ steps.install.outputs.trunc-path }}

runs:
  using: composite
  steps:
    - name: macOS is not supported yet
      if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "::error title=ci-restore::macOS is not supported yet: trunc has no macOS build. Use tar on macOS runners, or run ci-restore on ubuntu-latest, ubuntu-24.04-arm or windows-latest."
        exit 1

    - name: install trunc
      id: install
      if: runner.os != 'macOS'
      shell: bash
      env:
        TRUNC_BIN: ${{ inputs.trunc-path }}
        TRUNC_VERSION: ${{ inputs.version }}
        TRUNC_REPO: ${{ inputs.repository }}
        TRUNC_TOKEN: ${{ inputs.token }}
        TRUNC_VERIFY_CHECKSUM: ${{ inputs.verify-checksum }}
      run: |
        CI_RESTORE_OUTPUT="$GITHUB_OUTPUT" bash "$GITHUB_ACTION_PATH/ci-restore.sh" install
        path=$(sed -n 's/^trunc-path=//p' "$GITHUB_OUTPUT" | tail -n 1)
        dirname "$path" >> "$GITHUB_PATH"

    - name: restore
      id: restore
      if: runner.os != 'macOS'
      shell: bash
      env:
        TRUNC_BIN: ${{ steps.install.outputs.trunc-path }}
        CI_RESTORE_CONSUME: ${{ inputs.consume }}
        CI_RESTORE_SHA256: ${{ inputs.sha256 }}
        CI_RESTORE_DOWNLOAD_DIR: ${{ runner.temp }}
        ARCHIVE: ${{ inputs.archive }}
        DEST: ${{ inputs.path }}
        ARGS: ${{ inputs.args }}
      run: |
        # ARGS is split on whitespace on purpose: it holds trunc flags.
        # shellcheck disable=SC2086
        CI_RESTORE_OUTPUT="$GITHUB_OUTPUT" bash "$GITHUB_ACTION_PATH/ci-restore.sh" "$ARCHIVE" "$DEST" -- $ARGS
