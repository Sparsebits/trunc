<!doctype html>
<!--
  Source for the README banner. Rendered to docs/assets/banner-{dark,light}.png by render.ps1.
  Palette and type: Space Grotesk headlines, IBM Plex Mono captions, vermilion #ff5b35 accent.
  Open with ?theme=light for the light variant.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #080808; --ink: #f3f1ee; --muted: #7d7b78; --faint: #4a4a4a;
    --line: #161616; --accent: #ff5b35; --accent-text: #ff7959; --panel: #0e0e0e;
  }
  :root.light {
    --bg: #faf9f7; --ink: #121212; --muted: #8a8784; --faint: #b9b5af;
    --line: #ece9e4; --accent: #ff5b35; --accent-text: #c93a17; --panel: #ffffff;
  }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1280px; height: 400px; overflow: hidden; position: relative;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 28px; border: 1px solid var(--line); }

  .left { position: absolute; left: 88px; top: 70px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark { display: flex; flex-direction: column; gap: 5px; }
  .mark i { display: block; height: 9px; background: var(--accent); }
  .wordmark { font-weight: 700; font-size: 44px; letter-spacing: -1.5px; color: var(--ink); line-height: 1; }
  .tag {
    margin-left: 6px; padding: 5px 9px; border: 1px solid var(--faint);
    font: 500 13px/1 'IBM Plex Mono', monospace; letter-spacing: 1.5px; color: var(--muted);
  }
  h1 {
    margin: 46px 0 0; font-weight: 600; font-size: 60px; line-height: 1.04;
    letter-spacing: -2.4px; color: var(--ink);
  }
  h1 .dim { color: var(--muted); }
  h1 .dot { color: var(--accent); }
  .meta {
    margin-top: 40px; display: flex; gap: 30px;
    font: 500 17px/1 'IBM Plex Mono', monospace; letter-spacing: 0.2px;
  }
  .meta .cmd { color: var(--muted); }
  .meta .cmd b { color: var(--ink); font-weight: 500; }
  .meta .url { color: var(--ink); letter-spacing: 1.2px; }
  .meta .url span { color: var(--accent); }

  /* The archive being consumed: solid blocks are still in the archive, outlines are space
     already handed back to the disk; the "cut" marks where truncation has reached. */
  .viz { position: absolute; right: 84px; top: 100px; width: 380px; height: 232px; }
  .row { position: absolute; left: 0; display: flex; gap: 10px; transform: skewY(-9deg); }
  .row.archive { top: 26px; }
  .row.output { top: 138px; }
  .blk { width: 60px; height: 52px; box-sizing: border-box; }
  .solid { background: var(--accent); }
  .ghost { border: 2px dashed var(--accent); opacity: 0.55; }
  .out { background: var(--ink); opacity: 0.9; }
  .pending { border: 1.5px solid var(--faint); }
  .label {
    position: absolute; font: 500 13px/1 'IBM Plex Mono', monospace; letter-spacing: 1.6px;
    color: var(--muted); text-transform: uppercase;
  }
  .label.a { left: 0; top: -12px; }
  .label.o { left: 0; top: 108px; }
  .cut {
    position: absolute; left: 207px; top: 6px; width: 2px; height: 212px; background: var(--accent);
    transform: skewX(-9deg);
  }
  .cut::after {
    content: 'EOF'; position: absolute; top: -30px; left: -38px;
    font: 500 13px/1 'IBM Plex Mono', monospace; letter-spacing: 1.6px; color: var(--accent-text);
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="left">
    <div class="brand">
      <div class="mark"><i style="width:34px"></i><i style="width:24px"></i><i style="width:14px"></i></div>
      <div class="wordmark">trunc</div>
      <div class="tag">BY SPARSEBITS</div>
    </div>
    <h1>Extract huge archives<br><span class="dim">without the free space</span><span class="dot">.</span></h1>
    <div class="meta">
      <div class="cmd">$ <b>trunc x</b> big.zip <b>--consume</b></div>
      <div class="url">GITHUB.COM/SPARSEBITS/TRUNC <span>↗</span></div>
    </div>
  </div>

  <div class="viz">
    <div class="label a">archive</div>
    <div class="row archive">
      <div class="blk solid"></div><div class="blk solid"></div><div class="blk solid"></div>
      <div class="blk ghost"></div><div class="blk ghost"></div>
    </div>
    <div class="label o">output</div>
    <div class="row output">
      <div class="blk pending"></div><div class="blk pending"></div><div class="blk pending"></div>
      <div class="blk out"></div><div class="blk out"></div>
    </div>
    <div class="cut"></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get('theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  </script>
</body>
</html>
