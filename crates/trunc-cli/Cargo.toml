[package]
name = "trunc-cli"
description = "Extract archives bigger than your free space: trunc deletes the archive as it extracts, crash-safely."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["archive", "extract", "zip", "tar", "decompression"]
categories = ["command-line-utilities", "compression", "filesystem"]

[[bin]]
name = "trunc"
path = "src/main.rs"

# `cargo binstall trunc-cli` downloads the release archive instead of compiling. On Linux it
# falls back from the gnu target to the static musl build.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/trunc-{ target }{ archive-suffix }"
bin-dir = "trunc-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
trunc-prof.workspace = true
trunc-chunk.workspace = true
trunc-codec.workspace = true
trunc-core.workspace = true
trunc-engine.workspace = true
trunc-fs.workspace = true
trunc-legacy.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile.workspace = true
trunc-testkit.workspace = true

[lints]
workspace = true
