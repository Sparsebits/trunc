[package]
name = "trunc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
trunc-core = { path = "../crates/trunc-core" }
trunc-hash = { path = "../crates/trunc-hash" }
trunc-fs = { path = "../crates/trunc-fs" }
trunc-legacy = { path = "../crates/trunc-legacy" }
trunc-testkit = { path = "../crates/trunc-testkit" }
# Reference decoders the stream targets compare against.
bzip2 = "0.6"
liblzma = { version = "0.4", features = ["static"] }
zstd = { version = "0.13", default-features = false }

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "footer"
path = "fuzz_targets/footer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip"
path = "fuzz_targets/zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tar"
path = "fuzz_targets/tar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bzip2"
path = "fuzz_targets/bzip2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xz"
path = "fuzz_targets/xz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zstd"
path = "fuzz_targets/zstd.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sevenz"
path = "fuzz_targets/sevenz.rs"
test = false
doc = false
bench = false
