name: ci-restore-test

# Tests the ci-restore flavor (flavors/ci-restore): a ~200 MB .tar.zst built in the job is
# restored with `uses: ./flavors/ci-restore` and consume, using trunc built from this commit.
on:
  workflow_dispatch:
  push:
    paths: ["flavors/ci-restore/**", ".github/workflows/ci-restore-test.yml"]
  pull_request:
    paths: ["flavors/ci-restore/**", ".github/workflows/ci-restore-test.yml"]

permissions:
  contents: read

jobs:
  restore:
    name: restore (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: build trunc
        run: |
          cargo build --release --locked -p trunc-cli
          bin="$PWD/target/release/trunc"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          echo "TRUNC_LOCAL=$bin" >> "$GITHUB_ENV"

      - name: build a ~200 MB .tar.zst
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p src/data/random src/data/text/deep/er src/data/empty
          for i in $(seq 1 40); do head -c 5242880 /dev/urandom > "src/data/random/r$i.bin"; done
          for i in $(seq 1 10); do seq 1 2000000 | sed "s/^/line $i /" > "src/data/text/deep/er/t$i.txt"; done
          for i in $(seq 1 500); do echo "small $i" > "src/data/text/s$i.txt"; done
          (cd src && find data -type f | sort | xargs sha256sum) > sums.txt
          find src -type f -printf '%s\n' | awk '{ s += $1 } END { print "EXPECTED_BYTES=" s }' >> "$GITHUB_ENV"
          tar -cf - -C src data | zstd -T0 -3 -q -o cache.tar.zst
          rm -rf src
          ls -l cache.tar.zst
          df -h . || true

      - name: restore with consume
        id: restore
        uses: ./flavors/ci-restore
        with:
          archive: ${{ runner.temp }}/cache.tar.zst
          path: ${{ runner.temp }}/restored
          trunc-path: ${{ env.TRUNC_LOCAL }}

      - name: check
        working-directory: ${{ runner.temp }}
        env:
          WRITTEN: ${{ steps.restore.outputs.bytes-written }}
          SAVED: ${{ steps.restore.outputs.space-saved }}
          DURATION: ${{ steps.restore.outputs.duration }}
        run: |
          echo "bytes-written=$WRITTEN space-saved=$SAVED duration=$DURATION"
          test ! -e cache.tar.zst || { echo "the archive is still there"; exit 1; }
          (cd restored && sha256sum --quiet -c ../sums.txt)
          test -d restored/data/empty
          test "$WRITTEN" = "$EXPECTED_BYTES" || { echo "bytes-written $WRITTEN, expected $EXPECTED_BYTES"; exit 1; }
          test "$SAVED" -gt 150000000 || { echo "space-saved $SAVED is too small"; exit 1; }
          test -n "$DURATION"
          trunc --version # the action put trunc on PATH

      - name: restore without consume keeps the archive
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p small && echo hello > small/a.txt
          tar -cf - small | zstd -q -o small.tar.zst
      - uses: ./flavors/ci-restore
        with:
          archive: ${{ runner.temp }}/small.tar.zst
          path: ${{ runner.temp }}/small-out
          consume: "false"
          trunc-path: ${{ env.TRUNC_LOCAL }}
      - name: check no-consume
        working-directory: ${{ runner.temp }}
        run: |
          test -f small.tar.zst
          test "$(cat small-out/small/a.txt)" = hello

  # Installs trunc from a published release, the way users get it. Skipped while the repository
  # has no published (non-draft) release.
  install:
    name: install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: published release?
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::no published release of ${{ github.repository }} yet; skipping the install test"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: small archive
        if: steps.rel.outputs.found == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p small && echo hello > small/a.txt
          tar -cf - small | zstd -q -o small.tar.zst
      - uses: ./flavors/ci-restore
        if: steps.rel.outputs.found == 'true'
        id: restore
        with:
          archive: ${{ runner.temp }}/small.tar.zst
          path: ${{ runner.temp }}/out
          repository: ${{ github.repository }}
      - name: check
        if: steps.rel.outputs.found == 'true'
        working-directory: ${{ runner.temp }}
        run: |
          echo "${{ steps.restore.outputs.trunc-version }}"
          test ! -e small.tar.zst
          test "$(cat out/small/a.txt)" = hello

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./flavors/ci-restore
        id: restore
        continue-on-error: true
        with:
          archive: nothing.tar.zst
      - name: the action refuses macOS
        if: steps.restore.outcome != 'failure'
        run: |
          echo "expected ci-restore to fail on macOS"
          exit 1
