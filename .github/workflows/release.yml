name: release

# A pushed `v*` tag builds every target, smoke-tests it, and creates a *draft* GitHub release with
# the archives, per-file .sha256 files, SHA256SUMS and a CycloneDX SBOM per target. Publishing the
# draft is a manual step. Running the workflow by hand builds and uploads the same files as
# artifacts only (a dry run).
#
# Supply chain: third-party actions are pinned to commit SHAs, the toolchain and build tools are
# pinned to exact versions, and only the release job (which compiles nothing) can write to the
# repository or mint the OIDC token used for Sigstore build-provenance attestations.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The exact compiler for published binaries. It overrides the `stable` channel in
  # rust-toolchain.toml (rustup gives RUSTUP_TOOLCHAIN precedence over the file). Bump it on purpose.
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          # Cross-compiled on the x64 runner, whose Visual Studio has the ARM64 build tools.
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    env:
      TRUNC_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      # Archive timestamps come from the commit, so repackaging the same commit gives the same bytes.
      - name: source date
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # Linux binaries are static (musl), so they run on any distribution. zig provides the C
      # cross-compiler for zstd and the musl libc for both architectures.
      - name: install zig
        if: runner.os == 'Linux'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: ${{ runner.os == 'Linux' && 'cargo-zigbuild@0.23.4,cargo-cyclonedx@0.5.9' || 'cargo-cyclonedx@0.5.9' }}
      # Windows binaries link the C runtime statically, so they run without the Visual C++
      # Redistributable (vcruntime140.dll) installed.
      - name: build
        shell: bash
        run: |
          rustc --version --verbose
          if [ "$RUNNER_OS" = Linux ]; then build=zigbuild; else build=build; fi
          if [ "$RUNNER_OS" = Windows ]; then export RUSTFLAGS="-C target-feature=+crt-static"; fi
          cargo $build --locked --profile dist --target ${{ matrix.target }} -p trunc-cli
          if [ "$RUNNER_OS" = Windows ] && grep -aqi 'vcruntime140' "target/${{ matrix.target }}/dist/trunc.exe"; then
            echo "trunc.exe still imports vcruntime140.dll"; exit 1
          fi

      # The aarch64 binaries are cross-compiled and cannot run on these x64 runners.
      - name: smoke test
        if: ${{ !startsWith(matrix.target, 'aarch64-') }}
        shell: bash
        run: |
          bin="$PWD/target/${{ matrix.target }}/dist/trunc"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          mkdir -p smoke/data && echo hello > smoke/data/a.txt && cd smoke
          "$bin" create a.trnc data
          "$bin" x a.trnc -C out --consume --yes
          test "$(cat out/data/a.txt)" = hello

      - name: package
        shell: bash
        run: |
          name="trunc-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/dist/trunc.exe" "dist/$name/"
            find "dist/$name" -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
            asset="$name.zip"
            (cd dist && 7z a -tzip -mtc=off -bso0 "$asset" "$name")
          else
            cp "target/${{ matrix.target }}/dist/trunc" "dist/$name/"
            asset="$name.tar.gz"
            tar -C dist --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
              -cf - "$name" | gzip -n > "dist/$asset"
          fi
          (cd dist && sha256sum "$asset" > "$asset.sha256" && cat "$asset.sha256")

      # The dependency tree compiled into this target's binary (CycloneDX JSON).
      - name: sbom
        shell: bash
        run: |
          sbom="trunc-${{ matrix.target }}.cdx"
          cargo cyclonedx --manifest-path crates/trunc-cli/Cargo.toml --format json --spec-version 1.5 \
            --target ${{ matrix.target }} --override-filename "$sbom" -q
          mv "crates/trunc-cli/$sbom.json" dist/
          find crates -name "$sbom.json" -delete

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/*.cdx.json
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job with write access, and the only one that can request an OIDC token. It runs no
    # build tools: it checks the tag, writes SHA256SUMS, attests and drafts the release.
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore signing certificate for the attestations
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tag matches the crate version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SBOM serial numbers
        # cargo-cyclonedx omits `serialNumber`, which actions/attest needs to recognise CycloneDX.
        # A UUIDv5 of the commit and file name keeps the SBOMs reproducible.
        run: |
          for f in dist/*.cdx.json; do
            python3 - "$f" "$GITHUB_SHA" <<'EOF'
          import json, sys, uuid, os
          path, sha = sys.argv[1], sys.argv[2]
          with open(path, encoding="utf-8") as fh:
              bom = json.load(fh)
          if not bom.get("serialNumber"):
              name = f"github.com/Sparsebits/trunc/{sha}/{os.path.basename(path)}"
              bom = {"bomFormat": bom["bomFormat"], "specVersion": bom["specVersion"],
                     "serialNumber": f"urn:uuid:{uuid.uuid5(uuid.NAMESPACE_URL, name)}",
                     **{k: v for k, v in bom.items() if k not in ("bomFormat", "specVersion")}}
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump(bom, fh, indent=2)
                  fh.write("\n")
          EOF
          done
      - name: checksums and release notes
        run: |
          (cd dist && sha256sum *.zip *.tar.gz *.cdx.json > SHA256SUMS && cat SHA256SUMS)
          # The CHANGELOG section for this version, without its heading.
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## / && on { exit }
            on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }

      # Signed build provenance (Sigstore) for every release asset, and each target's SBOM bound
      # to its archive. Verify with `gh attestation verify <file> --repo Sparsebits/trunc`
      # (docs/security.md). GitHub offers attestations for private repositories only on
      # Enterprise Cloud, so these steps run once the repository is public.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        env:
          NODE_OPTIONS: --max-http-header-size=32768 # as the attest-* wrapper actions set it
        with:
          subject-path: dist/trunc-x86_64-pc-windows-msvc.zip
          sbom-path: dist/trunc-x86_64-pc-windows-msvc.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        env:
          NODE_OPTIONS: --max-http-header-size=32768 # as the attest-* wrapper actions set it
        with:
          subject-path: dist/trunc-aarch64-pc-windows-msvc.zip
          sbom-path: dist/trunc-aarch64-pc-windows-msvc.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        env:
          NODE_OPTIONS: --max-http-header-size=32768 # as the attest-* wrapper actions set it
        with:
          subject-path: dist/trunc-x86_64-unknown-linux-musl.tar.gz
          sbom-path: dist/trunc-x86_64-unknown-linux-musl.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        env:
          NODE_OPTIONS: --max-http-header-size=32768 # as the attest-* wrapper actions set it
        with:
          subject-path: dist/trunc-aarch64-unknown-linux-musl.tar.gz
          sbom-path: dist/trunc-aarch64-unknown-linux-musl.cdx.json

      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "trunc $GITHUB_REF_NAME" --notes-file notes.md
