name: fuzz

# Fuzzing runs locally (scripts/fuzz.ps1), where the corpus persists and all cores are available.
# This workflow is kept for occasional manual runs on Linux with AddressSanitizer.
on:
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [header, footer, manifest, zip, tar, inflate, inflate_diff, bzip2, xz, zstd, parallel_equiv, resume_equiv]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: fuzz ${{ matrix.target }} for 30 minutes
        working-directory: fuzz
        # The repo pins stable in rust-toolchain.toml; fuzzing needs nightly explicitly.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1800
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
