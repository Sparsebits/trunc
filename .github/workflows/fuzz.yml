name: fuzz

# Fuzzing runs locally (scripts/fuzz.ps1), where the corpus persists and all cores are available.
# This workflow is kept for occasional manual runs on Linux with AddressSanitizer.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [header, footer, manifest, zip, tar, inflate, inflate_diff, bzip2, xz, zstd, parallel_equiv, resume_equiv, iso, image_json, image_manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: fuzz ${{ matrix.target }} for 30 minutes
        working-directory: fuzz
        # The repo pins stable in rust-toolchain.toml; fuzzing needs nightly explicitly.
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=1800
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
